
<!DOCTYPE html>
<html>
<head>
    <title>PE 2.0 Queue</title>

    <meta charset="UTF-8">

    <script>

        async function updateQueue() {

            try {

                const response = await fetch("/api/queue");
                const data = await response.json();

                document.getElementById("count").textContent = data.count;

                const queue = document.getElementById("queue");

                queue.innerHTML = "";

                if (data.queue.length === 0) {

                    queue.innerHTML = "<p>Queue is empty.</p>";

                    return;
                }

                data.queue.forEach(function(job, index) {

                    const container = document.createElement("div");

                    container.innerHTML =
                        "<hr>" +
                        "<b>ID:</b> " + job.id + "<br>" +
                        "<b>Position:</b> " + (index + 1) + "<br>" +
                        "<b>Username:</b> " + job.username + "<br>" +
                        "<b>Created:</b> " + job.createdAt + "<br>" +
                        "<br>" +
                        "<b>Script:</b><br>" +
                        "<pre></pre>";

                    container.querySelector("pre").textContent = job.script;

                    queue.appendChild(container);

                });

            }

            catch (error) {

                console.error(error);

                document.getElementById("queue").innerHTML =
                    "<p>Unable to connect to server.</p>";

            }

        }


        async function clearQueue() {

            const count =
                document.getElementById("count").textContent;

            if (count == "0") {

                alert("The queue is already empty.");

                return;

            }

            if (!confirm(
                "Are you sure you want to clear the entire queue?"
            )) {

                return;

            }

            try {

                const response = await fetch(
                    "/api/queue/clear",
                    {
                        method: "POST"
                    }
                );

                const data = await response.json();

                if (data.success) {

                    alert(
                        "Cleared " + data.removed + " jobs."
                    );

                    updateQueue();

                }

                else {

                    alert(
                        "Error: " +
                        (data.error || "Unknown error")
                    );

                }

            }

            catch (error) {

                console.error(error);

                alert("Unable to clear queue.");

            }

        }


        updateQueue();

        setInterval(updateQueue, 1000);

    </script>

</head>

<body>

    <h1>PE 2.0 Queue</h1>

    <p>
        Queue:
        <b id="count">0</b>
    </p>

    <p>
        <button onclick="updateQueue()">
            Refresh
        </button>

        <button onclick="clearQueue()">
            Clear Queue
        </button>
    </p>

    <hr>

    <div id="queue">
        <p>Loading queue...</p>
    </div>

</body>
</html>
